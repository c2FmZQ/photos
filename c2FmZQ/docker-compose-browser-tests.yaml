services:
  chrome:
    container_name: "chrome"
    image: "chromedp/headless-shell:157.0.8103.15"
    user: "${USERID:-1000}"
    shm_size: "2gb"
    command: [
      "--ignore-certificate-errors",
      "--disable-gpu",
      "--disable-dev-shm-usage",
    ]
    healthcheck:
      test: ["CMD", "socat", "-", "TCP4:127.0.0.1:9222"]
      interval: 5s
      retries: 5
      start_period: 5s
    volumes:
      - type: tmpfs
        target: /nonexistent
        tmpfs:
          size: 10M
          mode: 0o1777

  devtest:
    container_name: "devtest"
    hostname: "devtest.local"
    image: "golang:1.27.3-alpine3.24"
    #tty: true
    #stdin_open: true
    user: "${USERID:-1000}"
    working_dir: "/home/user/src/c2FmZQ/c2FmZQ"
    command: "go test -v -failfast -tags chromedp -timeout=15m -count=1 -run='${TESTS:-.*}' ./internal/pwatests/..."
    environment:
     - HOME=/home/user
     - GOPATH=/home/user/go
     - GOCACHE=/home/user/.cache/go-build
     - CGO_ENABLED=0
    volumes:
      - "${GOCACHE:-$HOME/.cache/go-build}:/home/user/.cache/go-build"
      - "${GOPATH:-$HOME/go}:/home/user/go"
      - "${SRCDIR:-$HOME/src/c2FmZQ}:/home/user/src/c2FmZQ"
      - type: tmpfs
        target: /etc/ssl/certs
        tmpfs:
          size: 10M
          mode: 0o1777
    depends_on:
      chrome:
        condition: service_healthy
